<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pastebin TXT Uploader</title>
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: sans-serif;
      padding: 20px;
    }
    textarea, input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: none;
    }
    button {
      background-color: #00c853;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h2>Paste .txt to Pastebin</h2>
  <form id="pasteForm">
    <textarea name="text" placeholder="Enter .txt content..." required></textarea>
    <input type="text" name="title" placeholder="Title (optional)">
    <button type="submit">Create Paste</button>
  </form>
  <div id="result"></div>

  <script>
    document.getElementById('pasteForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const formData = new FormData(this);
      const response = await fetch('paste.php', {
        method: 'POST',
        body: formData
      });
      const result = await response.text();
      document.getElementById('result').innerHTML = `<a href="${result}" target="_blank">${result}</a>`;
    });
  </script>
</body>
</html>
