<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Paste to Pastebin</title>
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: sans-serif;
      padding: 20px;
    }
    textarea, input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: none;
    }
    button {
      background-color: #00c853;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h2>Paste to Pastebin (TXT Only)</h2>
  <textarea id="pasteContent" placeholder="Enter your text here..."></textarea>
  <input type="text" id="pasteTitle" placeholder="Paste title (optional)" />
  <button onclick="submitPaste()">Submit Paste</button>
  <div id="result"></div>

  <script>
    async function submitPaste() {
      const text = document.getElementById("pasteContent").value;
      const title = document.getElementById("pasteTitle").value;

      const formData = new FormData();
      formData.append("text", text);
      formData.append("title", title);

      const res = await fetch("paste.php", {
        method: "POST",
        body: formData
      });

      const url = await res.text();
      document.getElementById("result").innerHTML = `<a href="${url}" target="_blank">${url}</a>`;
    }
  </script>
</body>
</html>
